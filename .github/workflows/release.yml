name: release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build artifacts or publish through unified release gates
        type: choice
        default: staging
        options: [staging, stable]
      deploy_cloud:
        description: Back up, migrate and deploy cloud business service
        type: boolean
        default: false
      matrix_artifact_run_id:
        description: Prior run with reviewed component receipts for this source commit
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: gewu-unified-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    environment: ${{ inputs.channel }}
    env:
      GEWU_RELEASE_MANIFEST_PATH: output/ci-release/active.json
      APP_ENV: prod
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniapp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --legacy-peer-deps
      - run: npm --prefix backend install --no-package-lock
      - run: npm --prefix cloud-business-api install --no-package-lock --ignore-scripts
      - run: npm --prefix miniapp ci
      - run: python -m pip install -r scripts/requirements-deploy.txt
      - uses: actions/download-artifact@v4
        if: ${{ inputs.matrix_artifact_run_id != '' }}
        with:
          name: unified-release-matrix
          run-id: ${{ inputs.matrix_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output/ci-release
      - run: npm run release:prepare
      - name: Verify contracts
        run: |
          node scripts/release-boundary.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-workflow.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix storage-agent test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
      - name: Load temporary deployment credentials
        if: ${{ inputs.channel == 'stable' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'gewu-deploy-key'
          $hostsPath = Join-Path $env:RUNNER_TEMP 'gewu-known-hosts'
          $wechatPath = Join-Path $env:RUNNER_TEMP 'gewu-wechat.key'
          [IO.File]::WriteAllText($keyPath, $env:DEPLOY_KEY)
          [IO.File]::WriteAllText($hostsPath, $env:KNOWN_HOSTS)
          [IO.File]::WriteAllText($wechatPath, $env:WECHAT_PRIVATE_KEY)
          "DEPLOY_KEY_PATH=$keyPath" >> $env:GITHUB_ENV
          "GEWU_SSH_KNOWN_HOSTS=$hostsPath" >> $env:GITHUB_ENV
          "WECHAT_MINIAPP_PRIVATE_KEY_PATH=$wechatPath" >> $env:GITHUB_ENV
      - name: Back up and deploy cloud service
        if: ${{ inputs.channel == 'stable' && inputs.deploy_cloud }}
        run: python scripts/deploy_cloud_business_api.py deploy
      - name: Upload miniapp and record verified fixed-egress receipt
        if: ${{ inputs.channel == 'stable' }}
        env:
          WECHAT_MINIAPP_FIXED_EGRESS_IP: ${{ vars.WECHAT_MINIAPP_FIXED_EGRESS_IP }}
        run: python scripts/miniapp_fixed_egress.py
      - name: Build miniapp artifacts
        if: ${{ inputs.channel == 'staging' }}
        run: npm --prefix miniapp run build:weapp
      - name: Obtain reviewed portable Ruby runtime
        env:
          GEWU_RUBY_RUNTIME_URL: ${{ vars.GEWU_RUBY_RUNTIME_URL }}
          GEWU_RUBY_RUNTIME_SHA256: ${{ vars.GEWU_RUBY_RUNTIME_SHA256 }}
        run: |
          if ($env:GEWU_RUBY_RUNTIME_URL -notmatch '^https://[^/]+/' -or $env:GEWU_RUBY_RUNTIME_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Reviewed Ruby runtime URL and SHA-256 are required' }
          $archive = Join-Path $env:RUNNER_TEMP 'gewu-ruby.zip'
          $runtimeSource = Join-Path $env:RUNNER_TEMP 'gewu-ruby-runtime'
          Invoke-WebRequest -Uri $env:GEWU_RUBY_RUNTIME_URL -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GEWU_RUBY_RUNTIME_SHA256.ToLowerInvariant()) { throw 'Ruby runtime checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeSource
          "GEWU_RUBY_RUNTIME_SOURCE=$runtimeSource" >> $env:GITHUB_ENV
      - name: Package desktop with native ABI verification
        shell: cmd
        run: npm run dist:win
      - name: Restore Node native ABI after every packaging outcome
        if: ${{ always() }}
        shell: cmd
        run: npm run rebuild:node
      - name: Publish OSS only after compatible component receipts
        if: ${{ inputs.channel == 'stable' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_CDN_BASE_URL: ${{ vars.OSS_CDN_BASE_URL }}
          OSS_OBJECT_PREFIX: ${{ vars.OSS_OBJECT_PREFIX }}
        run: npm run publish:desktop-update
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: unified-release-matrix
          path: output/ci-release/active.json
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: gewu-release-artifacts
          path: |
            dist/*.exe
            dist/latest.yml
            miniapp/dist/**
